# Tests, builds and installs VPNMaster on Linux, Windows and macOS.
# On a version tag (v1.2.3) whose tests pass on every OS, the installers are published
# as a GitHub Release of this repository, where the in-app updater looks for them.
# Publishing uses the workflow's built-in GITHUB_TOKEN.
# The tests run against a stand-in for Cisco Secure Client (test/fake-cisco).

name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      ELECTRON_ENABLE_LOGGING: '0'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Linux setup (virtual display; allow Electron's sandbox from node_modules)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          # Ubuntu 24.04 blocks unprivileged user namespaces; the installed .deb brings its
          # own AppArmor profile, but Electron run from node_modules has none.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm ci

      - name: End-to-end tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm test; else npm test; fi

      # ---- build ----
      - name: Build .deb
        if: runner.os == 'Linux'
        run: npm run dist
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Build macOS dmg + zip (arm64 and x64)
        if: runner.os == 'macOS'
        run: npm run dist:mac

      # ---- install the installer, then test the installed app ----
      - name: Install .deb and test the installed app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/vpnmaster_*_amd64.deb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          ELECTRON_RUN_AS_NODE=1 /opt/VPNMaster/vpnmaster test/packaged-test.js /opt/VPNMaster/resources

      - name: Install on Windows and test the installed app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\VPNMaster-Setup-*.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\VPNMaster\VPNMaster.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter VPNMaster.exe | Select-Object -First 5; throw "VPNMaster.exe not found after install" }
          # VPNMaster.exe is a GUI program: PowerShell does not record its exit code with `&`,
          # so run it with Start-Process -Wait and read the code from the process object.
          $env:ELECTRON_RUN_AS_NODE = '1'
          $p = Start-Process $exe -ArgumentList @('test/packaged-test.js', "`"$env:LOCALAPPDATA\Programs\VPNMaster\resources`"") -Wait -PassThru -NoNewWindow -RedirectStandardOutput packaged-out.txt -RedirectStandardError packaged-err.txt
          Get-Content packaged-out.txt, packaged-err.txt
          if ($p.ExitCode -ne 0) { throw "packaged test failed ($($p.ExitCode))" }

      - name: Install from the dmg and test the installed app
        if: runner.os == 'macOS'
        run: |
          arch=$(uname -m); [ "$arch" = x86_64 ] && arch=x64
          dmg=$(ls dist/VPNMaster-*-mac-$arch.dmg | head -1)
          hdiutil attach -nobrowse -mountpoint /Volumes/vpnmaster "$dmg"
          mkdir -p "$RUNNER_TEMP/Applications"
          cp -R /Volumes/vpnmaster/VPNMaster.app "$RUNNER_TEMP/Applications/"
          hdiutil detach /Volumes/vpnmaster
          app="$RUNNER_TEMP/Applications/VPNMaster.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/VPNMaster" test/packaged-test.js "$app/Contents/Resources"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: vpnmaster-${{ runner.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release; only this job gets write access
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; fi

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "VPNMaster ${GITHUB_REF_NAME#v}" \
            --notes "Installers for Linux (.deb), Windows (.exe) and macOS (.dmg, Apple Silicon and Intel). Installed apps update themselves from this page. Cisco Secure Client itself is not included: install the version your company provides."
